<svg
    xmlns="http://www.w3.org/2000/svg"
    width="200"
    height="200"
    viewBox="0 0 200 200"
>
  <!-- Clou mark, depicting 13:55 - hour hand pinned at I, minute hand
       at XI, emptying lap (per ClockArc.span) - as a 60 degree craie arc
       from XI to I, across the top. Two brume accent arcs echo the other
       rings: top-right for StepsRing, bottom-left for SunRing.

       Dots mark the hours no arc covers, same rule as TimeRing.hourPoints
       (covered points, ends included, get nothing - the arc is their
       mark). XII additionally gets an encre gap cut, since it's a cardinal
       point the time arc has passed (TimeRing.quarterGaps).

       All positions use Layout's convention: x = cx + r*sin(theta),
       y = cy - r*cos(theta), theta clockwise from XII. Arcs are plain
       `M .. A` commands (sweep-flag 1 = clockwise, large-arc-flag 1 only
       above 180 degrees) - no dasharray tricks. -->
  <circle cx="100" cy="100" r="92" fill="#000000" />

  <!-- Time arc: XI (330deg) clockwise 60deg to I (30deg). -->
  <path
        d="M 62 34.18 A 76 76 0 0 1 138 34.18"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"
    />

  <!-- Hour bar at I (30deg), the pinned hour: a plain radial line through
       the ring, same style as the gap cut at XII. -->
  <line
        x1="134"
        y1="41.11"
        x2="142"
        y2="27.26"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="butt"
    />

  <!-- Gap cut at XII: an encre stroke through the time arc, wider than it. -->
  <line x1="100" y1="16" x2="100" y2="32" stroke="#000000" stroke-width="8" />

  <!-- Steps accent: anchored at XII like the real StepsRing (a fixed
       start, filling clockwise with progress), 0deg to 60deg, inset - a
       smaller radius than the time ring, echoing StepsRing sitting inside
       TimeRing in the real face. -->
  <path
        d="M 100 45 A 55 55 0 0 1 147.63 72.5"
        fill="none"
        stroke="#88A4AC"
        stroke-width="5"
        stroke-linecap="round"
    />

  <!-- Sun-event accent, bottom-left: 220deg to 265deg, same inset radius. -->
  <path
        d="M 64.65 142.13 A 55 55 0 0 1 45.21 104.80"
        fill="none"
        stroke="#88A4AC"
        stroke-width="5"
        stroke-linecap="round"
    />

  <!-- Brume dots at hours the time ring doesn't cover, skipping quarters
       (they get a tick below instead): II, IV, V, VII, VIII, X. -->
  <circle cx="165.82" cy="62" r="4" fill="#88A4AC" />
  <circle cx="165.82" cy="138" r="4" fill="#88A4AC" />
  <circle cx="138" cy="165.82" r="4" fill="#88A4AC" />
  <circle cx="62" cy="165.82" r="4" fill="#88A4AC" />
  <circle cx="34.18" cy="138" r="4" fill="#88A4AC" />
  <circle cx="34.18" cy="62" r="4" fill="#88A4AC" />

  <!-- Brume ticks at the quarters the time ring doesn't cover: III, VI, IX -
       same tick-not-dot treatment as XII's gap cut and I's hour bar. -->
  <line
        x1="168"
        y1="100"
        x2="184"
        y2="100"
        stroke="#88A4AC"
        stroke-width="5"
        stroke-linecap="butt"
    />
  <line
        x1="100"
        y1="168"
        x2="100"
        y2="184"
        stroke="#88A4AC"
        stroke-width="5"
        stroke-linecap="butt"
    />
  <line
        x1="32"
        y1="100"
        x2="16"
        y2="100"
        stroke="#88A4AC"
        stroke-width="5"
        stroke-linecap="butt"
    />

  <!-- A tick at each brume arc's start, same idea as the craie hour bar. -->
  <line
        x1="100"
        y1="53"
        x2="100"
        y2="37"
        stroke="#88A4AC"
        stroke-width="5"
        stroke-linecap="butt"
    />
  <line
        x1="69.79"
        y1="136.00"
        x2="59.50"
        y2="148.26"
        stroke="#88A4AC"
        stroke-width="5"
        stroke-linecap="butt"
    />
</svg>
